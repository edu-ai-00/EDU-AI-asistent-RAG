# ══════════════════════════════════════════════════════════════
#  ISOLATED DEV STACK FOR VERIFYING THE QA PORTAL — not for any server.
#
#  WHY THIS FILE EXISTS. The base docker-compose.yml gives EVERY service a fixed
#  `container_name`. It is absolute, not per project, so `-p other_project` on its
#  own does NOT ISOLATE: a second stack would try to create a container named
#  edu_ai_postgres, collide with the running one or — worse — test against
#  someone else's. This override renames every container and moves the
#  published ports to another range.
#
#  IMAGE TAGS. Containers and ports were renamed, but `image:` in the base compose
#  was not — every service builds under a SHARED tag (edu_ai_search:1.0 …).
#  `docker compose build` in this project therefore overwrote the very tag the
#  normal local stack takes its image from; a running container does not notice,
#  but on the next `up -d --force-recreate` the local stack would start the dev
#  build. It happened on 14 Sep 2026. Every service built here therefore has its
#  own `:qadev` tag. Pulled images (nginx, pgadmin, bifrost, cloudflared) are not
#  affected.
#
#  Volumes are prefixed with the project name on their own
#  (eduai_qadev_postgres_data), so an empty volume yields a CLEAN database from
#  postgres/init_clean — with the made-up schools of the seed, never from production.
#
#  START (from the repository root; always pass -f and -p explicitly so that
#  COMPOSE_FILE / COMPOSE_PROJECT_NAME from .env are not used):
#
#      docker compose -p eduai_qadev \
#        -f docker-compose.yml -f docker-compose.qa-dev.yml up -d
#
#  CLEANUP (removes ONLY this project's volumes):
#
#      docker compose -p eduai_qadev \
#        -f docker-compose.yml -f docker-compose.qa-dev.yml down -v
#
#  Before any write, check what the stack is really connected to:
#      docker inspect qadev_edu_ai_search --format '{{json .NetworkSettings.Networks}}'
#      docker exec qadev_edu_ai_postgres psql -U edu_ai -d edu_ai -c "select current_database()"
# ══════════════════════════════════════════════════════════════

services:

  nginx:
    container_name: qadev_edu_ai_nginx
    # !override REPLACES the list. Without it Compose adds the ports and 80/8443/8444
    # would collide with the user's stack.
    ports: !override
      - "127.0.0.1:18000:80"   # VPN side: /qa/, /qa-api/v1/, /chat/, /api/
      - "127.0.0.1:18001:81"   # tunnel listener — MUST return 404 for /qa/

  edu_ai_api:
    container_name: qadev_edu_ai_api
    image: edu_ai_api:qadev
    ports: !override
      - "127.0.0.1:18080:8080"

  edu_ai:
    container_name: qadev_edu_ai_langflow
    image: edu_ai:qadev
    ports: !override
      - "127.0.0.1:17860:7860"

  postgres:
    container_name: qadev_edu_ai_postgres
    image: edu_ai_postgres:qadev
    ports: !override
      - "127.0.0.1:15432:5432"
    # Renaming the container silently broke service-to-service DNS. Consumers
    # address the database as ${POSTGRES_DB_SERVER:-edu_ai_postgres}, which in
    # the normal stack resolves via the container_name alias — here that alias
    # became qadev_edu_ai_postgres, so edu_ai_search failed with
    # "could not translate host name edu_ai_postgres". The alias below restores
    # the name INSIDE this project's data network only. It cannot reach the
    # user's stack: that postgres lives on a different network (edu_ai_data),
    # and the failure mode this replaces was a hard error, never a silent
    # connection to the real database.
    networks:
      data:
        aliases:
          - edu_ai_postgres

  pgadmin:
    container_name: qadev_edu_ai_pgadmin
    ports: !override []
    # nginx.conf resolves the upstream as edu_ai_pgadmin, which in the normal
    # stack is the container_name. Renaming it here made nginx die on startup
    # with "host not found in upstream" — and nginx dying takes the whole edge
    # down, so the /qa/ routing could not be tested at all. Same fix as the
    # postgres alias above, scoped to this project's edge network.
    networks:
      edge:
        aliases:
          - edu_ai_pgadmin
      data: {}

  edu_ai_search:
    container_name: qadev_edu_ai_search
    image: edu_ai_search:qadev
    ports: !override
      - "127.0.0.1:18090:8090"

  edu_ai_web_chat:
    container_name: qadev_edu_ai_web_chat
    image: edu_ai_web_chat:qadev
    ports: !override
      - "127.0.0.1:18081:8081"

  edu_ai_qa_admin:
    container_name: qadev_edu_ai_qa_admin
    image: edu_ai_qa_admin:qadev
    # Published ONLY for the tests of this stack. In the production compose the
    # portal has no host port — access goes through nginx only.
    ports: !override
      - "127.0.0.1:18082:8082"
    environment:
      # The tests call the portal both directly on 127.0.0.1:18082 and through
      # nginx on 18000; both must pass the CSRF/origin check.
      # http://nginx is the origin seen by the Playwright browser running INSIDE
      # the dev network (the service is called nginx). Without it every write
      # from a browser test would end with a 403 from the origin check. Dev stack only.
      - QA_PORTAL_ALLOWED_ORIGINS=http://127.0.0.1:18000,http://localhost:18000,http://127.0.0.1:18082,http://localhost:18082,http://nginx

  bifrost:
    container_name: qadev_bifrost
    ports: !override []

  cloudflared:
    container_name: qadev_cloudflared
    # A tunnel does not belong in the dev stack: it would expose the test data.
    profiles: ["disabled"]
