# ══════════════════════════════════════════════════════════════
#  Search API surface — ONE copy, included by every server block
#  that is allowed to serve it (port 80 catch-all, port 81 tunnel).
#
#  It lives in its own file because the two server blocks must not be
#  able to drift: the path allowlist is the only thing left deciding what
#  a caller can reach, and a second hand-maintained copy is how one block
#  quietly gains an endpoint the other refuses.
#
#  The named @err locations belong here too — error_page resolves them
#  per server block, so a server that includes /search/ without them
#  answers nginx's own errors as unparseable HTML.
# ══════════════════════════════════════════════════════════════

# ── Search API (LangGraph) — no authentication here, see below ─
location /search/ {
    # nginx authenticates NOTHING on this surface, deliberately, since
    # 2026-09-02. The perimeter is Cloudflare Access on the tunnel (port 81)
    # and the AWS security group on port 80 — both configured outside this
    # repo, so scripts/perimeter_check.py exists to notice from off-site when
    # either stops holding. Run it on a schedule or this file is load-bearing
    # for nothing.
    #
    # The allowlist below is NOT authentication: it decides which endpoints
    # exist at all, for a caller who is already past the perimeter.
    #
    # default_type, NOT add_header: `return` takes its Content-Type from
    # default_type, so the add_header form that used to sit under the 404
    # below was a no-op and the refusal went out as
    # application/octet-stream — with nosniff set, which forbids a strict
    # client from reading the JSON at all. Measured on production
    # 2026-08-21.
    default_type application/json;

    # 404 rather than 403 — from a client's side the endpoint genuinely is not
    # there, and 403 would confirm that it is. Same envelope the service
    # returns, so a client parses one shape whether the refusal came from the
    # edge or from the application.
    if ($search_path_allowed = 0) {
        return 404 '{"error":{"code":"NOT_FOUND","message":"No such endpoint.","retryable":false}}';
    }

    limit_req zone=api_limit burst=20 nodelay;

    # nginx generates these itself (rate limit, oversized body, upstream
    # gone) and would answer with an HTML page the client cannot parse.
    error_page 413 = @err413;
    error_page 429 = @err429;
    error_page 502 503 = @err5xx;
    error_page 504 = @err504;

    # A question is capped at 2000 characters, so anything approaching a
    # megabyte is a mistake — but it must be a parseable one.
    client_max_body_size 1m;

    proxy_pass http://search_service/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Search can take time (LLM calls)
    proxy_read_timeout 120s;
}

# ── Envelope for the errors nginx raises on its own ─
location @err413 {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","retryable":false}}';
}
location @err429 {
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down and retry.","retryable":true}}';
}
location @err5xx {
    default_type application/json;
    return 503 '{"error":{"code":"UNAVAILABLE","message":"The service is temporarily unavailable.","retryable":true}}';
}
# Distinct from UNAVAILABLE on purpose: a search that ran past
# proxy_read_timeout may still be worth retrying with the SAME
# Idempotency-Key, which is exactly what that header is for.
location @err504 {
    default_type application/json;
    return 504 '{"error":{"code":"TIMEOUT","message":"The search did not finish in time.","retryable":true}}';
}

# ── Block everything else ─
location / {
    # default_type, not add_header — see the note under /search/
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"No such endpoint.","retryable":false}}';
}
