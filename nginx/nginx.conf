worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    map_hash_bucket_size 128;

    # ── Compression ──────────────────────────────
    # A /search answer measured 21 kB, of which 15 kB is the `trace` diagnostics
    # the mobile client ignores but still pays to download. This JSON compresses
    # ~7x, so it is the cheapest fix and needs no change on either side.
    #
    # application/json ONLY, and deliberately NOT text/event-stream: gzipping an
    # SSE response makes nginx buffer it, which is the one thing a stream must
    # never do (/search/stream, /chat/{id}/stream).
    #
    # gzip_proxied any — without it nginx leaves proxied responses alone, and
    # every response here is proxied, so the whole block would be a no-op.
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;

    # ── Rate limiting ────────────────────────────
    # 10 req/s per IP  (burst absorbs short spikes)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 429, not nginx's default 503. The contract documents rate limiting as 429
    # with retryable:true, and a client that branches on the status was told to
    # look for an outage instead of backing off. error_page below gives it the
    # same envelope as every other refusal.
    limit_req_status 429;
    # Admin plane deliberately far looser than the public one: pgAdmin fires
    # dozens of XHRs per page and throttled itself at 5r/s. These ports are
    # admin-only (8443/8444), so the limit is a runaway guard, not access
    # control — that is what Basic auth and the SG are for.
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=100r/s;

    # ── Search API keys ──────────────────────────
    # Mounted secret (nginx/auth_keys.conf, not in git): defines
    # map $http_authorization $search_authorized { default 0; "<key>" 1; }
    # The key is BARE — no "Bearer " prefix. This comment claimed otherwise for
    # months while the deployed map never had one, so anyone re-provisioning from
    # auth_keys.conf.example got 401 on every request.
    include /etc/nginx/auth_keys.conf;

    # ── What the API key is allowed to REACH ─────
    # The key opens /search/, and /search/ used to mean the whole service: sixteen
    # operations, including /v1/query-log (every question anyone has asked) and
    # /v1/staff-users (a school's staff list). No handler applies a narrower check
    # of its own, so a key shipped inside a mobile app read all of it.
    #
    # This is the published client surface and nothing else — contracts/openapi.yaml
    # §"Další endpointy", exactly. The rest of the service is reached by the gateway
    # and the web chat BFF, which both call edu_ai_search:8090 DIRECTLY on the
    # internal network (docker-compose.yml SEARCH_URL / SEARCH_BASE_URL) and never
    # traverse nginx — so narrowing the edge cannot affect them.
    #
    # Exact matches, not prefixes: /search/v1/ask must not also admit
    # /search/v1/ask-anything-else. Add a line here when a client is genuinely
    # given a new endpoint, and say so in the published contract at the same time.
    map $uri $search_path_allowed {
        default                 0;
        /search/health          1;
        /search/v1/ask          1;
        /search/v1/ask/stream   1;
        /search/v1/entities     1;
        /search/v1/code-lists   1;
        /search/v1/ui-labels    1;
        /search/v1/explain      1;   # diagnostic, published; runs no LLM and scopes to nothing
    }

    # ── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream backends ────────────────────────
    upstream fastapi {
        server edu_ai_api:8080;
    }

    upstream langflow {
        server edu_ai:7860;
    }

    upstream pgadmin {
        server edu_ai_pgadmin:80;
    }

    upstream search_service {
        server edu_ai_search:8090;
    }

    upstream web_chat {
        server edu_ai_web_chat:8081;
    }

    # ══════════════════════════════════════════════
    # PUBLIC  –  Mobile / external API
    # ══════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Security headers (apply to proxied responses) ─
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;

        # Health check
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Public API (FastAPI) — Basic auth (admin/content ops) ─
        location /api/ {
            auth_basic           "edu_ai admin";
            auth_basic_user_file /etc/nginx/.htpasswd;

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upload size for PDF ingestion
            client_max_body_size 50m;
        }

        # ── Search API + the error envelopes + the catch-all 404 ─
        # Shared with the tunnel server on port 81 — see nginx/search_api.conf.
        include /etc/nginx/search_api.conf;

        # ── VPN-only web chat ───────────────────────
        location = /chat {
            return 308 /chat/;
        }

        location /chat/ {
            limit_req zone=api_limit burst=20 nodelay;

            # No trailing slash: keep the /chat/ prefix expected by the BFF.
            proxy_pass http://web_chat;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 130s;
        }

    }

    # ══════════════════════════════════════════════
    # TUNNEL  –  Cloudflare (rag.edu-ai.eu), port 81
    #
    # The Search API and NOTHING else. Its own listener rather than a
    # server_name on 80, for two reasons:
    #
    #   default-deny  a location added to the public block above does not
    #                 appear here by accident. Only what this file includes
    #                 is reachable; /chat/, /api/ and /health are not.
    #   host-proof    matching on server_name would hand the decision to
    #                 whatever Host cloudflared forwards. A port cannot be
    #                 spoofed by a header.
    #
    # 81 is NOT published to the host — it does not belong in the compose
    # `ports` list. cloudflared shares the `edge` network and reaches this
    # as http://edu_ai_nginx:81, which is what the dashboard ingress must say.
    # ══════════════════════════════════════════════
    server {
        listen 81;
        server_name _;

        # ── The client IP, or the rate limit becomes collective ─
        # Every request through the tunnel arrives from ONE peer, the cloudflared
        # container, so without this $remote_addr is that container for all of
        # them: api_limit (10r/s per IP) turns into 10r/s for the whole internet
        # and one busy caller 429s everybody, while the access log records
        # 172.x for every line. Cloudflare puts the real address in
        # CF-Connecting-IP.
        #
        # Trusting the header is only safe where the peer cannot be anyone: port
        # 81 is NOT published to the host, so the only thing that can connect is
        # a container on the docker networks — hence the private range here, and
        # deliberately NOT on port 80, which has no trustworthy proxy in front.
        set_real_ip_from 172.16.0.0/12;
        real_ip_header   CF-Connecting-IP;

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;

        include /etc/nginx/search_api.conf;
    }

    # ══════════════════════════════════════════════
    # ADMIN  –  Internal tools (port 8443)
    # Reachable only over the VPN — enforced by the AWS security group.
    # ══════════════════════════════════════════════
    server {
        listen 8443;
        server_name _;

        # ── pgAdmin (supports subpath via X-Script-Name) ─
        location /pgadmin/ {
            limit_req zone=admin_limit burst=100 nodelay;

            proxy_pass http://pgadmin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name     /pgadmin;
            # X-Script-Name alone is not enough: without these, pgAdmin builds
            # its redirects and static-asset URLs from what it sees (http, no
            # prefix, port 80) and the login round-trip breaks behind /pgadmin/.
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   8443;
            proxy_set_header X-Forwarded-Prefix /pgadmin;
        }
    }

    # ══════════════════════════════════════════════
    # LANGFLOW UI  (dedicated host at ROOT, port 8444)
    # Langflow is a SPA that must be served at "/" — it cannot
    # run under a subpath (per docs.langflow.org). In production
    # use a subdomain (server_name langflow.<domain>) instead.
    # Reachable only over the VPN — enforced by the AWS security group.
    # ══════════════════════════════════════════════
    server {
        listen 8444;
        server_name _;

        client_max_body_size 100M;

        location / {
            limit_req zone=admin_limit burst=100 nodelay;

            proxy_pass http://langflow/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long-running flows + streaming (per Langflow docs)
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;
            proxy_buffering         off;
            proxy_request_buffering off;
        }
    }
}
