worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    map_hash_bucket_size 128;

    # ── Compression ──────────────────────────────
    # A /search answer measured 21 kB, of which 15 kB is the `trace` diagnostics
    # the mobile client ignores but still pays to download. This JSON compresses
    # ~7x, so it is the cheapest fix and needs no change on either side.
    #
    # application/json ONLY, and deliberately NOT text/event-stream: gzipping an
    # SSE response makes nginx buffer it, which is the one thing a stream must
    # never do (/search/stream, /chat/{id}/stream).
    #
    # gzip_proxied any — without it nginx leaves proxied responses alone, and
    # every response here is proxied, so the whole block would be a no-op.
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;

    # ── Rate limiting ────────────────────────────
    # 10 req/s per IP  (burst absorbs short spikes)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 429, not nginx's default 503. The contract documents rate limiting as 429
    # with retryable:true, and a client that branches on the status was told to
    # look for an outage instead of backing off. error_page below gives it the
    # same envelope as every other refusal.
    limit_req_status 429;
    # Admin plane deliberately far looser than the public one: pgAdmin fires
    # dozens of XHRs per page and throttled itself at 5r/s. These ports are
    # admin-only (8443/8444), so the limit is a runaway guard, not access
    # control — that is what Basic auth and the SG are for.
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=100r/s;

    # ── What a caller is allowed to REACH ────────
    # nginx no longer authenticates anyone (2026-09-02): the perimeter is
    # Cloudflare Access on the tunnel and the AWS security group on port 80,
    # and scripts/perimeter_check.py watches both from off-site. What used to
    # be an API key here protected nothing a shipped mobile binary could keep
    # secret anyway.
    #
    # /search/ used to mean the whole service: sixteen operations, including
    # /v1/query-log (every question anyone has asked) and /v1/staff-users (a
    # school's staff list). No handler applies a check of its own, so this map
    # is the only thing keeping them off the edge.
    #
    # This is the published client surface and nothing else. Keep it in step with
    # the searchApiKey description in contracts/openapi.yaml, which names this
    # same list. The rest of the service is reached by the gateway and the web
    # chat BFF, which both call edu_ai_search:8090 DIRECTLY on the
    # internal network (docker-compose.yml SEARCH_URL / SEARCH_BASE_URL) and never
    # traverse nginx — so narrowing the edge cannot affect them.
    #
    # Exact matches, not prefixes: /search/v1/ask must not also admit
    # /search/v1/ask-anything-else. Adding a line here now publishes that
    # endpoint to anyone past the perimeter — say so in the published contract
    # at the same time.
    map $uri $search_path_allowed {
        default                 0;
        /search/health          1;
        /search/v1/ask          1;
        /search/v1/ask/stream   1;
        /search/v1/entities     1;
        /search/v1/code-lists   1;
        /search/v1/ui-labels    1;
        # The AREA picker's catalog, published 2026-09-06 for the mobile client
        # (spec.search-domain-scope §3). Reference data only: per-school DOMAIN
        # codes and their translated names, resolved by
        # resolved_taxonomy_rules — the same rows /v1/code-lists already
        # publishes for grades and roles. No question, no answer, no user
        # content. EXACT path, like every line here: a prefix would also admit
        # /search/v1/domains-anything and, worse, invites the next endpoint to
        # be published by accident.
        /search/v1/domains      1;
        # Diagnostic, published; runs no LLM and stops after the deterministic
        # QA prefix. It now resolves the caller's ENTITY, ROLE and AREA through
        # the same preparation as /v1/ask (2026-09-06) — before that it
        # resolved no entity at all, so it scoped to nothing by accident rather
        # than by rule, which is not a property a published path should rest on.
        /search/v1/explain      1;
    }

    # ── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    # S2 does not filter the access log: the compose healthcheck (one GET /health
    # from 127.0.0.1 every 15 s) is logged like any other request.
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Forwarded client address ──────────────────────
    # Every proxy_set_header X-Forwarded-For below sends $remote_addr ALONE: nginx's own
    # view of the client (the CF-Connecting-IP value for a trusted tunnel peer, otherwise
    # the TCP peer). A chain supplied by the caller is dropped, not appended to
    # ($proxy_add_x_forwarded_for), so no leftmost entry is client-controlled.

    # ── Name resolution ──────────────────────────
    # Upstream names are resolved at RUN time through Docker's embedded DNS, not
    # once at start. nginx therefore starts when a backend does not exist yet
    # (the old `host not found in upstream` was fatal and took the whole edge
    # down) and follows a replaced container to its new IP without a reload.
    # `resolve` in an upstream block needs nginx >= 1.27.3 and a shared `zone`.
    # `valid=5s` overrides Docker's much longer TTL. This changes how names are
    # found; it does not change who is trusted (see set_real_ip_from below).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # ── Upstream backends ────────────────────────
    upstream fastapi {
        zone fastapi_z 64k;
        server edu_ai_api:8080 resolve;
    }

    upstream langflow {
        zone langflow_z 64k;
        server edu_ai:7860 resolve;
    }

    upstream pgadmin {
        zone pgadmin_z 64k;
        server edu_ai_pgadmin:80 resolve;
    }

    upstream search_service {
        zone search_service_z 64k;
        server edu_ai_search:8090 resolve;
    }

    upstream web_chat {
        zone web_chat_z 64k;
        server edu_ai_web_chat:8081 resolve;
    }

    upstream qa_admin {
        zone qa_admin_z 64k;
        server edu_ai_qa_admin:8082 resolve;
    }

    # ══════════════════════════════════════════════
    # PUBLIC  –  Mobile / external API
    # ══════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Security headers (apply to proxied responses) ─
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;

        # Health check
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Public API (FastAPI) — admin/content ops, NO auth ─
        # Basic auth was removed 2026-09-02 along with the /search/ key: this
        # port is VPN-only (AWS security group, verified from off-site by
        # scripts/perimeter_check.py) and /chat/ next door already relied on
        # exactly that. Note what this means — /api/ writes: it ingests
        # documents and has no login of its own, unlike pgAdmin and Langflow on
        # 8443/8444. Every WireGuard peer can now write here.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upload size for PDF ingestion
            client_max_body_size 50m;
        }

        # ── Search API + the error envelopes + the catch-all 404 ─
        # Shared with the tunnel server on port 81 — see nginx/conf/search_api.conf.
        include /etc/nginx/search_api.conf;

        # ── VPN-only web chat ───────────────────────
        location = /chat {
            return 308 /chat/;
        }

        location /chat/ {
            limit_req zone=api_limit burst=20 nodelay;

            # No trailing slash: keep the /chat/ prefix expected by the BFF.
            proxy_pass http://web_chat;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 130s;
        }

        # ── VPN-only QA portal ──────────────────────
        # BOTH locations belong to this listener ONLY. They are deliberately NOT
        # in nginx/conf/search_api.conf, because that file is shared with the port-81
        # Cloudflare tunnel — putting them there would publish the admin surface
        # to the internet. The tunnel listener below must keep answering 404 here.
        #
        # Port 80 being VPN-only is enforced by infrastructure (AWS security
        # group / WireGuard), not by this comment and not by Docker's expose.
        # Verify the path from the VPN AND from outside after deployment.
        location = /qa {
            return 308 /qa/;
        }

        # Static SPA. The prefix is kept (no trailing slash on proxy_pass), so
        # the app is built with base /qa/ and its asset URLs resolve unchanged.
        location /qa/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://qa_admin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Versioned JSON API of the SAME container. Same origin as the SPA above,
        # which is why no CORS is opened anywhere for this.
        location /qa-api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://qa_admin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CSV/ZIP imports of whole packs.
            client_max_body_size 50m;
            # Publishing calls the SYNCHRONOUS ingest; keep this above the
            # portal's own ingest timeout so the caller receives the portal's
            # error envelope instead of an nginx 504.
            proxy_connect_timeout 10s;
            proxy_read_timeout 130s;
        }

    }

    # ══════════════════════════════════════════════
    # TUNNEL  –  Cloudflare (rag.edu-ai.eu), port 81
    #
    # The Search API and NOTHING else. Its own listener rather than a
    # server_name on 80, for two reasons:
    #
    #   default-deny  a location added to the public block above does not
    #                 appear here by accident. Only what this file includes
    #                 is reachable; /chat/, /api/ and /health are not.
    #   host-proof    matching on server_name would hand the decision to
    #                 whatever Host cloudflared forwards. A port cannot be
    #                 spoofed by a header.
    #
    # 81 is NOT published to the host — it does not belong in the compose
    # `ports` list. cloudflared shares the `edge` network and reaches this
    # as http://edu_ai_nginx:81, which is what the dashboard ingress must say.
    # ══════════════════════════════════════════════
    server {
        listen 81;
        server_name _;

        # ── The client IP, or the rate limit becomes collective ─
        # Every request through the tunnel arrives from ONE peer, the cloudflared
        # container, so without this $remote_addr is that container for all of
        # them: api_limit (10r/s per IP) turns into 10r/s for the whole internet
        # and one busy caller 429s everybody, while the access log records
        # 172.x for every line. Cloudflare puts the real address in
        # CF-Connecting-IP.
        #
        # Trusting the header is only safe where the peer cannot be anyone. A private
        # range, a service name or the header itself prove nothing: every container on
        # `edge` (the API that fetches user URLs, Langflow, ...) can reach this port.
        # The trusted peer is therefore defined by NETWORK MEMBERSHIP: `tunnel` is a
        # dedicated small subnet that only nginx and cloudflared are attached to. Its
        # CIDR is the installation's own setting (EDU_AI_TUNNEL_SUBNET); Compose gives
        # the SAME value to the network and, as an inline config mounted below, to the
        # trust range, so it is written nowhere in this file. No such file, no trusted
        # peer. A peer on any other network, a proxy left on `edge` included, is NOT
        # trusted: its header is ignored and the rate limit counts the real peer, never
        # a forged address. Deliberately NOT on port 80, which has no trustworthy proxy.
        include /etc/edu_ai/tunnel/*.conf;
        real_ip_header   CF-Connecting-IP;

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;

        include /etc/nginx/search_api.conf;
    }

    # ══════════════════════════════════════════════
    # ADMIN  –  Internal tools (port 8443)
    # Reachable only over the VPN — enforced by the AWS security group.
    # ══════════════════════════════════════════════
    server {
        listen 8443;
        server_name _;

        # ── pgAdmin (supports subpath via X-Script-Name) ─
        location /pgadmin/ {
            limit_req zone=admin_limit burst=100 nodelay;

            proxy_pass http://pgadmin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name     /pgadmin;
            # X-Script-Name alone is not enough: without these, pgAdmin builds
            # its redirects and static-asset URLs from what it sees (http, no
            # prefix, port 80) and the login round-trip breaks behind /pgadmin/.
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   8443;
            proxy_set_header X-Forwarded-Prefix /pgadmin;
        }
    }

    # ══════════════════════════════════════════════
    # LANGFLOW UI  (dedicated host at ROOT, port 8444)
    # Langflow is a SPA that must be served at "/" — it cannot
    # run under a subpath (per docs.langflow.org). In production
    # use a subdomain (server_name langflow.<domain>) instead.
    # Reachable only over the VPN — enforced by the AWS security group.
    # ══════════════════════════════════════════════
    server {
        listen 8444;
        server_name _;

        client_max_body_size 100M;

        location / {
            limit_req zone=admin_limit burst=100 nodelay;

            proxy_pass http://langflow/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long-running flows + streaming (per Langflow docs)
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;
            proxy_buffering         off;
            proxy_request_buffering off;
        }
    }
}
