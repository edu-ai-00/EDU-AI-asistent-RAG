# Stable error codes — edu_ai Search Service
# Track: contract. Canonical owner of HTTP error semantics for the RAG module.
# Source of truth: search/app/server.py (_ERROR_CODES, _RETRYABLE, _error_body)
# and nginx/conf/nginx.conf (the statuses the edge raises before the app is reached).
# Do not define error codes elsewhere.
# Channel-local school-selection errors and config readiness are scoped separately
# below; they do not add or rename Search Service error codes.
#
# Two layers must not be confused:
#   * HTTP errors  — the request could not be processed (this file).
#   * outcomes     — the request succeeded (HTTP 200) but the cascade produced a
#                    non-answer (no_answer / blocked / role_required / ...).
#                    Outcomes live in the body, see
#                    contracts/schemas/search-response.schema.json.
#     role_required and llm_unavailable are OUTCOMES, not errors: both are 200.

version: 2   # v1 predated the error envelope and the versioned surface

# ── The envelope ─────────────────────────────────────────────────────────────
# EVERY error, from the app and from nginx, has one shape:
#
#   {"error": {"code": "...", "message": "...", "retryable": bool}}
#
# 422 adds `fields` (which field, and why). A client branches on `code`, never on
# a parsed message, and decides whether to retry from `retryable` rather than
# inferring it from the status — that inference used to send people hunting for
# outages that were not happening.
#
# The code list may GROW. A client must survive a code it does not know: treat
# an unknown code as its status class and obey `retryable`.

envelope:
  shape: '{"error": {"code": string, "message": string, "retryable": bool}}'
  extra_on_422: 'fields: [{"field": string, "message": string}]'
  retryable_means: >
    Whether repeating the IDENTICAL request can help. A rate limit, a timeout or
    an outage yes; a malformed body never.

http_errors:
  - status: 400
    code: BAD_REQUEST
    when: >
      question is empty or whitespace-only; or legal_entity is unknown or
      inactive. A `language` outside the code list used to land here too; since
      2026-08-23 it is a 422 like every other rejected field VALUE.
    retryable: false
    source: search/app/server.py
    client_action: Fix the field named in the message.

# 401 / UNAUTHORIZED is deliberately absent. nginx checked an API key on
# /search/ until 2026-09-02; nothing at any layer authenticates a caller now, so
# no 401 can be raised and a client that branches on one is handling a status
# that cannot arrive. See the Authentication note in ./openapi.yaml.

  - status: 403
    code: FORBIDDEN
    when: >
      The caller could not be established: a user_id was sent that is not an
      active user of the entity or of one above it, OR no user_id was sent while
      the platform requires one (settings visibility.search_requires_user on the
      GLOBAL row, init 99 — currently false, so anonymous callers are allowed).
      The message is deliberately generic and identical in both cases; a
      specific one would let anyone enumerate users and entities.
      Absent from the earlier hand-written client contract; clients written
      against that document must be prepared for this status.
    retryable: false
    source: search/app/server.py (_resolve_search_caller)
    client_action: >
      Send a real user_id, or have the platform switch checked. Retrying the
      same request cannot succeed.

  - status: 404
    code: NOT_FOUND
    when: >
      No such endpoint (the nginx catch-all, or the app router for an unknown
      path under /search/), or a named resource does not exist — an inactive QA
      pack on /v1/qa-export, an entity/user pair on /v1/ingest-principal.
    retryable: false
    source: search/app/server.py + nginx/conf/nginx.conf
    client_action: Check the path and the identifiers.

  - status: 405
    code: METHOD_NOT_ALLOWED
    when: The path exists but not for this HTTP method (e.g. GET /v1/ask).
    retryable: false
    source: fastapi router, wrapped by the Starlette handler in server.py
    client_action: Use the documented method.

  - status: 409
    code: IDEMPOTENCY_CONFLICT
    when: >
      The Idempotency-Key was already used with a DIFFERENT request body. Bodies
      are compared by a canonical hash, so re-serialising an identical request is
      not a conflict.
    retryable: false
    source: search/app/server.py + search/app/idempotency.py
    client_action: Use a fresh key for a genuinely new request.

  - status: 409
    code: IDEMPOTENCY_IN_PROGRESS
    when: >
      The same key and the same body are being computed right now by another
      request. A claim with no response goes stale after 5 minutes and is then
      taken over.
    retryable: true
    source: search/app/idempotency.py
    client_action: Back off and retry the same request with the same key.

  - status: 413
    code: PAYLOAD_TOO_LARGE
    when: >
      Request body over 1 MB on /search/ (nginx). A question is capped at 2000
      characters, so this is a guard rail rather than a limit anyone reaches.
    retryable: false
    source: nginx/conf/nginx.conf
    client_action: Send a smaller body.

  - status: 415
    code: UNSUPPORTED_MEDIA_TYPE
    when: The body is not application/json.
    retryable: false
    source: fastapi
    client_action: Set Content-Type to application/json.

  - status: 422
    code: VALIDATION_ERROR
    when: >
      The body did not match the request schema: a missing required field, a
      wrong type, question over 2000 characters, a conversation_id that is not a
      UUID, or an UNKNOWN FIELD — the schema is closed
      (additionalProperties false, enforced in the model since 2026-08-21), so a
      misspelled field name is an error rather than a silent no-op. Also a
      `language` outside the active code list (2026-08-23; it was a 400 before).

      Since 2026-09-06 also `domains`, the thematic AREA filter, in five ways:
      an empty array (omit the field or send null to search every area — an
      empty selection is a client-side bug and answering it with the whole
      corpus would hide it); an empty or whitespace-only element; a code that
      is unknown or inactive IN THIS SCHOOL'S catalog
      (resolved_taxonomy_rules is nearest-owner-exclusive, so a code another
      school defines is unknown here); a wrong type; and ONE bad code among
      several good ones, which fails the WHOLE request rather than silently
      searching a smaller set of areas than the user chose.
      `fields[].field` is `domains` or the indexed element (`domains[1]`), so a
      client can mark the offending choice rather than the whole picker.
      Validated BEFORE the role gate and BEFORE any idempotency claim, so a
      rejected request leaves no claim for its retry to collide with, and the
      early `role_required` answer can report a filter that really was checked.
      A valid code that labels no content is NOT an error: that is a successful
      request which may answer no_answer.
    retryable: false
    source: >
      search/app/server.py (_validation_exception_handler; _validate_language
      and _resolve_domains raise the same envelope by hand — the latter from
      search/app/domain_scope.py — and the HTTPException handler passes
      `fields` through)
    client_action: >
      Read `fields`: it names the offending field and the reason. A typo in a
      field NAME shows up here rather than as a puzzling 200. For a rejected
      `domains` code, refresh the catalog (GET /v1/domains?legal_entity=…) and
      ask the user to choose again — do NOT retry with `domains` omitted, which
      would answer a different question than the one they asked.

  - status: 429
    code: RATE_LIMITED
    when: >
      Over 10 req/s per IP with a burst of 20 (nginx). limit_req_status is set to
      429 explicitly — the nginx default is 503, which read as an outage.
    retryable: true
    source: nginx/conf/nginx.conf
    client_action: Back off and retry.

  - status: 500
    code: INTERNAL_ERROR
    when: >
      The cascade raised outside a pipeline step. Individual steps catch their
      own errors and fall through (executor.run_search), so a 500 means a
      failure around them — the active setting could not be loaded, the DB pool
      is down. The message is the constant "search failed"; the exception stays
      in the log, because it used to go out on the wire and told a client
      nothing it could act on. An idempotency claim is RELEASED on this path, so
      an immediate retry with the same key recomputes rather than answering
      IDEMPOTENCY_IN_PROGRESS for 5 minutes.
    retryable: true
    source: search/app/server.py
    client_action: Retry; if persistent, check the service logs and Postgres.

  - status: 502
    code: UPSTREAM_ERROR
    when: nginx was reached but the search service was not.
    retryable: true
    source: nginx/conf/nginx.conf
    client_action: Retry with backoff.

  - status: 503
    code: UNAVAILABLE
    when: >
      TWO causes, and they are reported with the same code because the client's
      action is the same for both.

      (1) The search service is not accepting connections (nginx).

      (2) Since 2026-09-06: the DOMAIN catalog could not be read while an
      EXPLICIT `domains` filter was being validated. Deliberately not a
      fall-through to an unfiltered search — the caller asked for a narrower
      one, and a wider answer is a different answer presented as the one they
      requested. Raised before any retrieval and before the SSE stream opens,
      so it is an ordinary HTTP error rather than an `error` event, and before
      the idempotency claim, so it leaves no claim behind. A request WITHOUT
      `domains` never reads the catalog and so never sees this.
    retryable: true
    source: >
      nginx/conf/nginx.conf; search/app/server.py (_resolve_domains, raised by
      search/app/domain_scope.DomainCatalogUnavailable)
    client_action: >
      Retry with backoff, with the SAME `domains`. Never retry by dropping the
      filter: the scoped answer and the unscoped one are different answers, and
      only the user may choose to widen the search.

  - status: 504
    code: TIMEOUT
    when: >
      The search ran past the nginx proxy_read_timeout of 120 s. Deliberately
      its own code rather than UNAVAILABLE: the answer may simply be slow, and a
      retry with the SAME Idempotency-Key is exactly the right move. Measured on
      1187 production questions — p50 under a second, p95 18.3 s, max 27.6 s —
      so 120 s is a wide margin, not a routine boundary.
    retryable: true
    source: nginx/conf/nginx.conf
    client_action: Retry with the same Idempotency-Key.

notes:
  - >
    The SSE endpoint (/v1/ask/stream) reports a cascade failure as an `error`
    EVENT carrying this same envelope, not as an HTTP status — the response has
    already begun by then. Errors raised BEFORE streaming starts (validation,
    unknown entity, auth) are ordinary HTTP errors from the table above.
  - >
    Logging never surfaces as an error: question_answer_log writes run as a
    fire-and-forget BackgroundTask after the response is sent, and any failure is
    swallowed (search/app/log.py). A logging failure NEVER changes the status or
    the body.
  - >
    Degradation, not error: if the answer LLM is unavailable the cascade returns
    HTTP 200 with outcome=llm_unavailable (init 139). It does not raise, and the
    client must NOT tell the user to rephrase — the corpus was fine, the model
    was not.

# Browser-school selection belongs to the web-chat BFF, not /v1/ask. The BFF
# uses the envelope above but keeps its existing lowercase channel-local codes.
web_chat_school_errors:
  surface: [/chat/api/message, /chat/api/domains]
  source: web_chat/web_chat.py
  errors:
    - status: 422
      code: school_required
      when: The picker is enabled and neither the request nor deployment supplies a school.
      retryable: false
      validation_field: legal_entity
      client_action: Choose an active school before sending again.
    - status: 422
      code: invalid_school
      when: The selected school is a placeholder, unknown or inactive in the current registry.
      retryable: false
      validation_field: legal_entity
      client_action: Refresh the active-school list and choose a school again.
    - status: 503
      code: entities_unavailable
      when: The upstream school registry cannot be read or has a malformed object, list or row.
      retryable: true
      client_action: Retry without falling back to another school.

# These are HTTP-200 configuration states, not error-envelope codes or Search
# outcomes. The browser also validates its remembered school against this list.
web_chat_config_readiness:
  surface: /chat/api/config
  status: 200
  source: web_chat/web_chat.py
  field: setup
  states:
    ready: A fixed school is configured, or the picker has a valid explicit deployment default.
    awaiting_selection: The picker has active schools but no usable deployment default.
    entities_unavailable: The registry cannot be read or its payload is malformed; offer retry.
    no_entities: The registry is well formed and contains no active schools.
    unconfigured: The picker is disabled and no fixed school is configured.
